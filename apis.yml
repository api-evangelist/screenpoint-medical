name: ScreenPoint Medical
description: 'ScreenPoint Medical is a Netherlands-based healthcare AI company, founded
  in 2014 by Professor Nico Karssemeijer and Professor Sir Michael Brady, that develops
  Transpara Breast AI for earlier detection of breast cancer in 2D (FFDM) and 3D (DBT)
  mammography. Transpara is vendor-agnostic, integrates into PACS and reading workflows
  via medical-imaging (DICOM) pipelines rather than a public developer API, and is
  FDA cleared (K241831, K232096) and CE marked (0344). The product is used in over
  200 clinics across 25+ countries and is backed by three randomized controlled trials
  (including MASAI in The Lancet). The company is backed by Insight Partners. This
  profile was enriched by the API Evangelist pipeline: no public developer/API surface
  exists, but real security-disclosure and compliance posture were captured.'
