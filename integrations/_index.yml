# ScreenPoint Medical integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in screenpoint-medical-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: screenpoint-medical-fda-ai-enabled-medical-devices
  label: FDA (AI-enabled medical devices)
  partner_name: FDA (AI-enabled medical devices)
  category: FDA-authorized AI-enabled medical device
  type: contract
  channel: regulator-register
  evidence: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?ID=K241831
  source: edge
  relationship: standard-participant
  contract_reference:
    register: FDA AI-enabled medical devices list (fda.gov/media/178541 CSV)
    standard: FDA AI-enabled medical device authorization
    spec_file: null
    role: fda-ai-device-holder
    registered_name: ScreenPoint Medical BV
    register_id: K241831
    matched_domain: null
    matched_by: register-name
    identity: register-name
    identity_source: register-name
    devices_sample:
    - Transpara
    - Transpara (2.1.0)
    - Transpara 1.7.0
    - Transpara 1.7.2
    - Transpara Density 1.0.0
    certified_products:
    - product: FDA-authorized AI-enabled device (Radiology)
      panel: Radiology
      lapsed: false
      latest_authorization: '2024-11-25'
    signal_note: certified_products = one entry per lead review PANEL, never per device; devices and submission
      numbers are context, never counted. The list carries current authorizations only, so lapsed is always false
    detected_by: sweep-medtech.py
    detected: '2026-10-20'
    other_registrations:
    - ScreenPoint Medical B.V.
    identity_note: register gave only the name; exact normalised match to the repo's apis.yml name, one repo, Wikidata
      P856 not contradicting (Kin 2026-10-20 decision 2)
  status: not-a-workflow
  arazzo: null
- slug: screenpoint-medical-health-canada-medical-device-licence
  label: Health Canada (Medical Device Licence)
  partner_name: Health Canada (Medical Device Licence)
  category: Canadian medical device licence
  type: contract
  channel: regulator-register
  evidence: https://health-products.canada.ca/api/medical-devices/company/?id=151544&lang=en&type=json
  source: edge
  relationship: standard-participant
  contract_reference:
    register: Health Canada Medical Devices Active Licence Listing (MDALL) public API (health-products.canada.ca/api/medical-devices)
    standard: Canada Medical Devices Regulations (SOR/98-282), Medical Device Licence
    spec_file: null
    role: licence-holder
    registered_name: SCREENPOINT MEDICAL B.V.
    register_country: NL
    register_id: https://health-products.canada.ca/api/medical-devices/company/?id=151544&lang=en&type=json
    company_status: A
    matched_domain: null
    matched_by: register-name
    certified_products:
    - product: Health Canada Medical Device Licence, Class II
      product_type: Class II
      risk_class: 2
      lapsed: false
      first_issued: '2020-11-27'
      conditional: true
      licences_sample:
      - SCREENPOINT TRANSPARA
    signal_note: certified_products = one entry per device RISK CLASS licensed by Health Canada, lapsed when no
      licence of that class is still issued (status I / D, no end date); licence names are a sample, licence and
      device counts are context, never counted
    detected_by: sweep-canada-medical-device-licensing.py
    detected: '2026-10-22'
    register_name_note: register-name 'screenpointmedical' = screenpoint-medical; no wikidata P856
    identity_source: register-name
    identity_note: register gave only the name; exact normalised match to the repo's apis.yml name, one repo, Wikidata
      P856 not contradicting (Kin 2026-10-20 decision 2)
  status: not-a-workflow
  arazzo: null
